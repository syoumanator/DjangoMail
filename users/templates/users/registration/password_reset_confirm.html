{% extends 'mailapp/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
  {% if validlink %}
<div class="password-reset-confirm">
    <h1>Создание нового пароля</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить новый пароль</button>
    </form>
</div>
  {% else %}
    <p>
      Вероятно ссылка неверна или уже была использована
    </p>
  {% endif %}
{% endblock %}
